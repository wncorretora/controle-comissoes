<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Comissões</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1c1c1f',
                        cardHeader: '#242428',
                        inputBg: '#18181b',
                        borderDark: '#2e2e33',
                        emeraldAccent: '#10b981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121214;
            color: #e4e4e7;
        }
        /* Style for custom date picker in dark mode */
        color-scheme: dark;
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Container Principal -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

        <!-- CABEÇALHO DA APLICAÇÃO -->
        <header class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                        Controle de comissões
                    </h1>
                    <p class="text-zinc-400 text-sm mt-1">
                        Acompanhe o recebimento e conciliação por seguradora
                    </p>
                </div>

                <!-- Ações Globais: Importar / Exportar Backup -->
                <div class="flex items-center gap-2">
                    <button id="btnExport" title="Exportar Backup dos Dados" class="px-3 py-2 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg border border-zinc-700 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> Exportar Dados
                    </button>
                    <label id="btnImportLabel" title="Importar Backup" class="px-3 py-2 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg border border-zinc-700 transition-colors cursor-pointer flex items-center gap-2">
                        <i class="fa-solid fa-upload"></i> Importar
                        <input type="file" id="importFile" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <!-- FILTRO DE COMPETÊNCIA E BOTÃO LIMPAR TUDO -->
            <div class="mt-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-t border-zinc-800/80 pt-6">
                <div class="w-full sm:w-80">
                    <label for="competenciaSelect" class="block text-xs font-medium text-zinc-400 mb-1.5">
                        Competência:
                    </label>
                    <div class="relative">
                        <input type="month" id="competenciaSelect" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <button id="btnResetAll" class="px-4 py-2.5 text-sm font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-300 rounded-lg border border-zinc-700 transition-colors duration-150 shadow-sm flex items-center gap-2">
                        Limpar tudo
                    </button>
                </div>
            </div>

            <!-- DASHBOARD DE INDICADORES (STAT CARDS) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                <!-- Seguradoras -->
                <div class="bg-cardBg border border-zinc-800/80 rounded-xl p-4 shadow-sm">
                    <span class="text-xs font-medium text-zinc-400 block mb-1">Seguradoras</span>
                    <span id="statTotal" class="text-2xl sm:text-3xl font-bold text-white">15</span>
                </div>
                <!-- Concluídas -->
                <div class="bg-cardBg border border-zinc-800/80 rounded-xl p-4 shadow-sm">
                    <span class="text-xs font-medium text-zinc-400 block mb-1">Concluídas</span>
                    <span id="statConcluidas" class="text-2xl sm:text-3xl font-bold text-white">0</span>
                </div>
                <!-- Em andamento -->
                <div class="bg-cardBg border border-zinc-800/80 rounded-xl p-4 shadow-sm">
                    <span class="text-xs font-medium text-zinc-400 block mb-1">Em andamento</span>
                    <span id="statEmAndamento" class="text-2xl sm:text-3xl font-bold text-white">0</span>
                </div>
                <!-- Pendentes -->
                <div class="bg-cardBg border border-zinc-800/80 rounded-xl p-4 shadow-sm">
                    <span class="text-xs font-medium text-zinc-400 block mb-1">Pendentes</span>
                    <span id="statPendentes" class="text-2xl sm:text-3xl font-bold text-white">15</span>
                </div>
            </div>
        </header>

        <!-- BARRA DE BUSCA RÁPIDA -->
        <div class="mb-6 flex justify-between items-center gap-4">
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                <input type="text" id="searchInsurer" placeholder="Buscar seguradora..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-9 pr-4 py-2 text-xs text-zinc-200 focus:outline-none focus:ring-1 focus:ring-emerald-500">
            </div>
            <button id="btnToggleExpand" class="text-xs text-zinc-400 hover:text-zinc-200 transition-colors flex items-center gap-1">
                <i class="fa-solid fa-up-right-and-down-left-from-center text-[10px]"></i> <span id="toggleExpandText">Recolher todos</span>
            </button>
        </div>

        <!-- LISTA DE SEGURADORAS (CARDS) -->
        <main id="insurersContainer" class="space-y-4">
            <!-- Cards inseridos dinamicamente pelo JavaScript -->
        </main>
    </div>

    <!-- NOTIFICAÇÃO DE SUCESSO OU TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white text-sm px-4 py-3 rounded-lg shadow-xl translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">Ação concluída!</span>
    </div>

    <!-- CAIXA DE DIÁLOGO DE CONFIRMAÇÃO (CUSTOM MODAL) -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">
            <h3 id="modalTitle" class="text-lg font-semibold text-white mb-2">Confirmação</h3>
            <p id="modalMessage" class="text-sm text-zinc-400 mb-6">Tem certeza de que deseja realizar esta operação?</p>
            <div class="flex justify-end gap-3">
                <button id="modalCancel" class="px-4 py-2 text-xs font-medium text-zinc-300 bg-zinc-800 hover:bg-zinc-700 rounded-lg transition-colors">Cancelar</button>
                <button id="modalConfirm" class="px-4 py-2 text-xs font-medium text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg transition-colors">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * CONFIGURAÇÃO E DADOS INICIAIS
         */
        
        // Lista rigorosamente ordenada em ordem alfabética (incluindo Omint)
        const INSURERS = [
            "AKAD",
            "Allianz",
            "Amil",
            "Bradesco",
            "Chubb",
            "Fairfax",
            "HDI",
            "Icatu",
            "Mapfre",
            "Omint",
            "Porto Seguro — Consórcio",
            "Porto Seguro — Fiança",
            "Porto Seguro — Vida e Demais",
            "Tokio Marine",
            "Unimed",
            "Yelum"
        ];

        // Etapas padrão conforme definição
        const STEPS = [
            { id: 1, label: "Acesso ao sistema da seguradora" },
            { id: 2, label: "Retirada do relatório de comissões" },
            { id: 3, label: "Conciliação com o Segfy" },
            { id: 4, label: "Verificação de divergências" },
            { id: 5, label: "Envio ao financeiro" },
            { id: 6, label: "Envio Nota Fiscal Seguradora" }
        ];

        // Estado Global dos Dados
        // Formato: { "YYYY-MM": { "NomeSeguradora": { noCommission: false, steps: { 1: { done: true, date: "2026-09-07" }, ... } } } }
        let appData = {};
        let currentCompetence = "";
        let allExpanded = true;

        // Referências DOM
        const competenciaSelect = document.getElementById('competenciaSelect');
        const insurersContainer = document.getElementById('insurersContainer');
        const statTotal = document.getElementById('statTotal');
        const statConcluidas = document.getElementById('statConcluidas');
        const statEmAndamento = document.getElementById('statEmAndamento');
        const statPendentes = document.getElementById('statPendentes');
        const btnResetAll = document.getElementById('btnResetAll');
        const searchInput = document.getElementById('searchInsurer');
        const btnToggleExpand = document.getElementById('btnToggleExpand');
        const toggleExpandText = document.getElementById('toggleExpandText');
        const btnExport = document.getElementById('btnExport');
        const importFile = document.getElementById('importFile');

        /**
         * INICIALIZAÇÃO
         */
        window.addEventListener('DOMContentLoaded', () => {
            // Define a competência inicial padrão (Setembro de 2026 ou Mês Atual)
            const today = new Date();
            const defaultYear = today.getFullYear();
            const defaultMonth = String(today.getMonth() + 1).padStart(2, '0');
            
            // Para bater com o exemplo do usuário (Setembro 2026 caso queira, ou ano corrente)
            // Se o ano atual for 2026, ele define o mês atual, senão padrão '2026-09'
            currentCompetence = `${defaultYear}-${defaultMonth}`;
            competenciaSelect.value = currentCompetence;

            loadDataFromStorage();
            renderInsurers();
            updateStats();

            // Event Listeners
            competenciaSelect.addEventListener('change', (e) => {
                currentCompetence = e.target.value || currentCompetence;
                ensureCompetenceDataExists(currentCompetence);
                renderInsurers();
                updateStats();
            });

            btnResetAll.addEventListener('click', () => {
                showModal(
                    "Limpar toda a competência",
                    `Deseja realmente redefinir todos os registros de comissão para a competência selecionada?`,
                    () => {
                        resetCompetenceData(currentCompetence);
                        renderInsurers();
                        updateStats();
                        showToast("Todas as seguradoras foram limpas!");
                    }
                );
            });

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const cards = insurersContainer.querySelectorAll('.insurer-card');
                cards.forEach(card => {
                    const name = card.dataset.name.toLowerCase();
                    if (name.includes(term)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });

            btnToggleExpand.addEventListener('click', () => {
                allExpanded = !allExpanded;
                toggleExpandText.textContent = allExpanded ? "Recolher todos" : "Expandir todos";
                const detailsElements = insurersContainer.querySelectorAll('details');
                detailsElements.forEach(d => {
                    d.open = allExpanded;
                });
            });

            // Backup Export & Import
            btnExport.addEventListener('click', exportData);
            importFile.addEventListener('change', importData);
        });

        /**
         * GERENCIAMENTO DE STORAGE
         */
        function loadDataFromStorage() {
            try {
                const stored = localStorage.getItem('controle_comissoes_db');
                if (stored) {
                    appData = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Erro ao carregar localStorage", e);
                appData = {};
            }
            ensureCompetenceDataExists(currentCompetence);
        }

        function saveDataToStorage() {
            try {
                localStorage.setItem('controle_comissoes_db', JSON.stringify(appData));
            } catch (e) {
                console.error("Erro ao salvar localStorage", e);
            }
        }

        function ensureCompetenceDataExists(comp) {
            if (!appData[comp]) {
                appData[comp] = {};
            }
            INSURERS.forEach(insurer => {
                if (!appData[comp][insurer]) {
                    appData[comp][insurer] = {
                        noCommission: false,
                        steps: {}
                    };
                    STEPS.forEach(step => {
                        appData[comp][insurer].steps[step.id] = {
                            done: false,
                            date: ""
                        };
                    });
                }
            });
            saveDataToStorage();
        }

        function resetCompetenceData(comp) {
            appData[comp] = {};
            ensureCompetenceDataExists(comp);
            saveDataToStorage();
        }

        /**
         * RENDERIZAÇÃO DA INTERFACE
         */
        function renderInsurers() {
            insurersContainer.innerHTML = '';
            const compData = appData[currentCompetence] || {};

            INSURERS.forEach(insurerName => {
                const insurerData = compData[insurerName] || { noCommission: false, steps: {} };
                const cardHtml = createInsurerCardHtml(insurerName, insurerData);
                insurersContainer.appendChild(cardHtml);
            });
        }

        function createInsurerCardHtml(insurerName, insurerData) {
            const wrapper = document.createElement('div');
            wrapper.className = "insurer-card bg-cardBg border border-zinc-800/90 rounded-xl overflow-hidden transition-all shadow-sm";
            wrapper.dataset.name = insurerName;

            const isNoCommission = insurerData.noCommission;
            
            // Cálculo de Progresso
            let doneCount = 0;
            const totalSteps = STEPS.length;

            if (isNoCommission) {
                doneCount = totalSteps;
            } else {
                STEPS.forEach(s => {
                    if (insurerData.steps[s.id] && insurerData.steps[s.id].done) {
                        doneCount++;
                    }
                });
            }

            // Badge Status Text & Style
            let badgeText = `${doneCount}/${totalSteps}`;
            let badgeBg = "bg-zinc-800 text-zinc-300 border-zinc-700";

            if (isNoCommission) {
                badgeText = "Sem comissão";
                badgeBg = "bg-amber-950/60 text-amber-300 border-amber-800/60";
            } else if (doneCount === totalSteps) {
                badgeText = "Concluído";
                badgeBg = "bg-emerald-950/70 text-emerald-400 border-emerald-800/70";
            } else if (doneCount > 0) {
                badgeBg = "bg-emerald-950/40 text-emerald-400 border-emerald-900/40";
            }

            const details = document.createElement('details');
            details.open = allExpanded;
            details.className = "group";

            // Header do Accordion (Summary)
            const summary = document.createElement('summary');
            summary.className = "flex items-center justify-between p-4 cursor-pointer select-none hover:bg-zinc-800/40 transition-colors list-none";
            summary.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-chevron-right text-zinc-500 text-xs group-open:rotate-90 transition-transform duration-200"></i>
                    <span class="font-semibold text-zinc-100 text-base sm:text-lg">${insurerName}</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs px-3 py-1 rounded-full font-medium border ${badgeBg}">
                        ${badgeText}
                    </span>
                </div>
            `;

            // Conteúdo do Accordion (Etapas)
            const content = document.createElement('div');
            content.className = "px-4 pb-4 pt-1 border-t border-zinc-800/60 space-y-3";

            // Monta cada etapa
            STEPS.forEach(step => {
                const stepState = insurerData.steps[step.id] || { done: false, date: "" };
                const isStepChecked = isNoCommission ? true : stepState.done;
                const dateValue = isNoCommission ? (stepState.date || getTodayFormatted()) : stepState.date;
                const isDisabled = isNoCommission;

                const stepRow = document.createElement('div');
                stepRow.className = `flex flex-col sm:flex-row sm:items-center justify-between p-2.5 rounded-lg border transition-colors ${
                    isStepChecked ? 'bg-zinc-900/40 border-zinc-800/60' : 'bg-transparent border-transparent hover:bg-zinc-900/30'
                }`;

                stepRow.innerHTML = `
                    <label class="flex items-center gap-3 cursor-pointer py-1 sm:py-0 flex-grow ${isDisabled ? 'opacity-60 cursor-not-allowed' : ''}">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" 
                                class="step-checkbox peer appearance-none w-5 h-5 rounded border border-zinc-600 bg-zinc-900 checked:bg-emerald-500 checked:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all ${isDisabled ? 'cursor-not-allowed' : 'cursor-pointer'}" 
                                data-insurer="${insurerName}" 
                                data-step="${step.id}" 
                                ${isStepChecked ? 'checked' : ''} 
                                ${isDisabled ? 'disabled' : ''}>
                            <i class="fa-solid fa-check text-zinc-950 text-xs absolute pointer-events-none opacity-0 peer-checked:opacity-100 font-bold"></i>
                        </div>
                        <span class="text-sm font-medium ${isStepChecked ? 'line-through text-zinc-500' : 'text-zinc-300'}">
                            ${step.label}
                        </span>
                    </label>

                    <div class="mt-2 sm:mt-0 flex items-center gap-2 self-end sm:self-auto">
                        <div class="relative">
                            <input type="date" 
                                class="step-date bg-zinc-900 border border-zinc-700/80 rounded-lg px-3 py-1.5 text-xs text-zinc-200 focus:outline-none focus:ring-1 focus:ring-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed" 
                                data-insurer="${insurerName}" 
                                data-step="${step.id}" 
                                value="${dateValue}" 
                                ${isDisabled ? 'disabled' : ''}>
                        </div>
                    </div>
                `;

                content.appendChild(stepRow);
            });

            // Rodapé do Card da Seguradora (Botões de Ação)
            const footerActions = document.createElement('div');
            footerActions.className = "flex items-center justify-between border-t border-zinc-800/60 pt-3 mt-4";

            footerActions.innerHTML = `
                <button class="btn-no-commission px-4 py-2 text-xs font-medium rounded-lg border transition-all ${
                    isNoCommission 
                        ? 'bg-amber-950/40 border-amber-800/80 text-amber-300 hover:bg-amber-900/50' 
                        : 'bg-zinc-800/80 border-zinc-700 text-zinc-300 hover:bg-zinc-700'
                }" data-insurer="${insurerName}">
                    ${isNoCommission ? '<i class="fa-solid fa-check mr-1.5"></i> Possui comissão' : '— Não possui comissão'}
                </button>

                <button class="btn-clear-insurer px-4 py-2 text-xs font-medium bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 rounded-lg transition-colors" data-insurer="${insurerName}">
                    Limpar
                </button>
            `;

            content.appendChild(footerActions);
            details.appendChild(summary);
            details.appendChild(content);
            wrapper.appendChild(details);

            // Bind Eventos dos Checkboxes, Dates e Botões
            attachCardEvents(wrapper, insurerName);

            return wrapper;
        }

        /**
         * EVENTOS INDIVIDUAIS DOS CARDS
         */
        function attachCardEvents(cardElement, insurerName) {
            // Checkbox Change
            const checkboxes = cardElement.querySelectorAll('.step-checkbox');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const stepId = e.target.dataset.step;
                    const isChecked = e.target.checked;
                    const dateInput = cardElement.querySelector(`.step-date[data-step="${stepId}"]`);

                    // Atualiza Estado
                    const insurer = appData[currentCompetence][insurerName];
                    insurer.steps[stepId].done = isChecked;

                    // Se marcar e a data estiver vazia, preenche com hoje
                    if (isChecked && !dateInput.value) {
                        const todayStr = getTodayFormatted();
                        dateInput.value = todayStr;
                        insurer.steps[stepId].date = todayStr;
                    } else if (!isChecked) {
                        // Opcional: mantém a data ou limpa? Vamos manter ou limpar se desejar. Padrão limpa se desmarcar.
                        // dateInput.value = "";
                        // insurer.steps[stepId].date = "";
                    }

                    saveDataToStorage();
                    refreshCard(insurerName);
                    updateStats();
                });
            });

            // Date Change
            const dateInputs = cardElement.querySelectorAll('.step-date');
            dateInputs.forEach(input => {
                input.addEventListener('change', (e) => {
                    const stepId = e.target.dataset.step;
                    const val = e.target.value;
                    appData[currentCompetence][insurerName].steps[stepId].date = val;
                    saveDataToStorage();
                });
            });

            // Botão "Não Possui Comissão"
            const btnNoCommission = cardElement.querySelector('.btn-no-commission');
            btnNoCommission.addEventListener('click', () => {
                const currentStatus = appData[currentCompetence][insurerName].noCommission;
                const newStatus = !currentStatus;
                
                appData[currentCompetence][insurerName].noCommission = newStatus;

                // Se marcar como "Sem Comissão", seta datas de hoje nos passos vazios
                if (newStatus) {
                    const todayStr = getTodayFormatted();
                    STEPS.forEach(s => {
                        appData[currentCompetence][insurerName].steps[s.id].done = true;
                        if (!appData[currentCompetence][insurerName].steps[s.id].date) {
                            appData[currentCompetence][insurerName].steps[s.id].date = todayStr;
                        }
                    });
                }

                saveDataToStorage();
                refreshCard(insurerName);
                updateStats();
                showToast(newStatus ? `Marcado como "Sem Comissão" para ${insurerName}` : `Restaurado envio de comissão para ${insurerName}`);
            });

            // Botão "Limpar" Seguradora Específica
            const btnClear = cardElement.querySelector('.btn-clear-insurer');
            btnClear.addEventListener('click', () => {
                showModal(
                    `Limpar ${insurerName}`,
                    `Deseja realmente limpar o progresso de ${insurerName} nesta competência?`,
                    () => {
                        appData[currentCompetence][insurerName] = {
                            noCommission: false,
                            steps: {}
                        };
                        STEPS.forEach(step => {
                            appData[currentCompetence][insurerName].steps[step.id] = {
                                done: false,
                                date: ""
                            };
                        });
                        saveDataToStorage();
                        refreshCard(insurerName);
                        updateStats();
                        showToast(`Dados de ${insurerName} foram limpos.`);
                    }
                );
            });
        }

        /**
         * RE-RENDERIZAR CARD ESPECÍFICO (Para evitar refazer toda a DOM)
         */
        function refreshCard(insurerName) {
            const oldCard = insurersContainer.querySelector(`.insurer-card[data-name="${CSS.escape(insurerName)}"]`);
            if (oldCard) {
                const wasOpen = oldCard.querySelector('details') ? oldCard.querySelector('details').open : true;
                const insurerData = appData[currentCompetence][insurerName];
                const newCard = createInsurerCardHtml(insurerName, insurerData);
                newCard.querySelector('details').open = wasOpen;
                insurersContainer.replaceChild(newCard, oldCard);
            }
        }

        /**
         * CÁLCULO E ATUALIZAÇÃO DOS CARDS ESTATÍSTICOS
         */
        function updateStats() {
            const compData = appData[currentCompetence] || {};
            const total = INSURERS.length;
            let concluidas = 0;
            let emAndamento = 0;
            let pendentes = 0;

            INSURERS.forEach(insurerName => {
                const data = compData[insurerName];
                if (!data) {
                    pendentes++;
                    return;
                }

                if (data.noCommission) {
                    concluidas++;
                    return;
                }

                let doneSteps = 0;
                STEPS.forEach(s => {
                    if (data.steps[s.id] && data.steps[s.id].done) {
                        doneSteps++;
                    }
                });

                if (doneSteps === STEPS.length) {
                    concluidas++;
                } else if (doneSteps > 0) {
                    emAndamento++;
                } else {
                    pendentes++;
                }
            });

            statTotal.textContent = total;
            statConcluidas.textContent = concluidas;
            statEmAndamento.textContent = emAndamento;
            statPendentes.textContent = pendentes;
        }

        /**
         * UTILITÁRIOS E HELPERS
         */
        function getTodayFormatted() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Custom Confirmation Modal
        function showModal(title, message, onConfirm) {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const btnConfirm = document.getElementById('modalConfirm');
            const btnCancel = document.getElementById('modalCancel');

            titleEl.textContent = title;
            msgEl.textContent = message;

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);

            const closeModal = () => {
                overlay.classList.add('opacity-0');
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 200);
            };

            const confirmHandler = () => {
                onConfirm();
                closeModal();
                cleanup();
            };

            const cancelHandler = () => {
                closeModal();
                cleanup();
            };

            function cleanup() {
                btnConfirm.removeEventListener('click', confirmHandler);
                btnCancel.removeEventListener('click', cancelHandler);
            }

            btnConfirm.addEventListener('click', confirmHandler);
            btnCancel.addEventListener('click', cancelHandler);
        }

        /**
         * EXPORTAR E IMPORTAR BACKUP (JSON)
         */
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `controle_comissoes_backup_${getTodayFormatted()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Backup exportado com sucesso!");
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (typeof imported === 'object' && imported !== null) {
                        appData = imported;
                        ensureCompetenceDataExists(currentCompetence);
                        saveDataToStorage();
                        renderInsurers();
                        updateStats();
                        showToast("Dados importados com sucesso!");
                    } else {
                        throw new Error("Formato inválido");
                    }
                } catch (err) {
                    showToast("Erro ao importar o arquivo JSON!");
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // Reset input
        }
    </script>
</body>
</html>
