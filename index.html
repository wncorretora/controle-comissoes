<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Comissões</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#121214',
              card: '#1c1c1f',
              border: '#2c2c30',
              input: '#18181b',
              accent: '#00b37e',
              accentHover: '#00875f',
              text: '#e1e1e6',
              muted: '#a8a8b3'
            }
          }
        }
      }
    }
  </script>
  <style>
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-text font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-brand-border pb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">Controle de comissões</h1>
        <p class="text-brand-muted text-sm mt-1">Acompanhe o recebimento e conciliação por seguradora</p>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="px-3 py-1.5 text-xs bg-brand-card hover:bg-brand-border border border-brand-border rounded-md text-brand-text transition">
          Exportar Backup
        </button>
        <label class="px-3 py-1.5 text-xs bg-brand-card hover:bg-brand-border border border-brand-border rounded-md text-brand-text cursor-pointer transition">
          Importar Backup
          <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
        </label>
      </div>
    </header>

    <!-- Filtros e Ações Globais -->
    <div class="space-y-4">
      <div>
        <label for="competencia" class="block text-xs font-semibold text-brand-muted uppercase tracking-wider mb-2">Competência:</label>
        <input type="month" id="competencia" onchange="changeCompetencia()" class="bg-brand-card border border-brand-border rounded-lg px-4 py-2 text-white w-full max-w-xs focus:outline-none focus:border-brand-accent">
      </div>

      <div>
        <button onclick="limparTudo()" class="px-4 py-2 border border-brand-border rounded-lg text-sm text-brand-text hover:bg-brand-card transition font-medium">
          Limpar tudo
        </button>
      </div>
    </div>

    <!-- Dashboard / Estatísticas -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-brand-card border border-brand-border rounded-xl p-4">
        <span class="text-xs text-brand-muted font-medium">Seguradoras</span>
        <div id="stat-total" class="text-2xl font-bold text-white mt-1">16</div>
      </div>
      <div class="bg-brand-card border border-brand-border rounded-xl p-4">
        <span class="text-xs text-brand-muted font-medium">Concluídas</span>
        <div id="stat-concluidas" class="text-2xl font-bold text-white mt-1">0</div>
      </div>
      <div class="bg-brand-card border border-brand-border rounded-xl p-4">
        <span class="text-xs text-brand-muted font-medium">Em andamento</span>
        <div id="stat-andamento" class="text-2xl font-bold text-white mt-1">0</div>
      </div>
      <div class="bg-brand-card border border-brand-border rounded-xl p-4">
        <span class="text-xs text-brand-muted font-medium">Pendentes</span>
        <div id="stat-pendentes" class="text-2xl font-bold text-white mt-1">16</div>
      </div>
    </div>

    <!-- Lista de Seguradoras -->
    <div id="insurers-container" class="space-y-4 pt-2">
      <!-- Inserido dinamicamente via JS -->
    </div>

  </div>

  <script>
    const insurersList = [
      "AKAD",
      "Allianz",
      "Amil",
      "Bradesco",
      "Chubb",
      "Fairfax",
      "HDI",
      "Icatu",
      "Mapfre",
      "Omint",
      "Porto Seguro — Consórcio",
      "Porto Seguro — Fiança",
      "Porto Seguro — Vida e Demais",
      "Tokio Marine",
      "Unimed",
      "Yelum"
    ];

    const defaultSteps = [
      "Acesso ao sistema da seguradora",
      "Retirada do relatório de comissões",
      "Conciliação com o Segfy",
      "Verificação de divergências",
      "Envio ao financeiro",
      "Envio Nota Fiscal Seguradora"
    ];

    let currentCompetencia = "";
    let appData = {};

    function init() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      currentCompetencia = `${year}-${month}`;
      
      document.getElementById('competencia').value = currentCompetencia;

      const stored = localStorage.getItem('controle_comissoes_db');
      if (stored) {
        try {
          appData = JSON.parse(stored);
        } catch(e) {
          appData = {};
        }
      }

      render();
    }

    function getTodayFormatted() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDateDisplay(val) {
      if (!val) return '';
      const parts = val.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[3]}`;
      }
      return val;
    }

    function ensureCompetenciaData() {
      if (!appData[currentCompetencia]) {
        appData[currentCompetencia] = {};
      }
      insurersList.forEach(ins => {
        if (!appData[currentCompetencia][ins]) {
          appData[currentCompetencia][ins] = {
            semComissao: false,
            steps: defaultSteps.map(() => ({ checked: false, date: '' }))
          };
        }
      });
    }

    function saveData() {
      localStorage.setItem('controle_comissoes_db', JSON.stringify(appData));
      updateStats();
    }

    function changeCompetencia() {
      const val = document.getElementById('competencia').value;
      if (val) {
        currentCompetencia = val;
        render();
      }
    }

    function toggleStep(insIndex, stepIndex) {
      ensureCompetenciaData();
      const insName = insurersList[insIndex];
      const step = appData[currentCompetencia][insName].steps[stepIndex];
      
      step.checked = !step.checked;
      if (step.checked && !step.date) {
        step.date = getTodayFormatted();
      } else if (!step.checked) {
        step.date = '';
      }

      saveData();
      renderInsurerCard(insIndex);
    }

    function changeStepDate(insIndex, stepIndex, val) {
      ensureCompetenciaData();
      const insName = insurersList[insIndex];
      appData[currentCompetencia][insName].steps[stepIndex].date = val;
      saveData();
    }

    function toggleSemComissao(insIndex) {
      ensureCompetenciaData();
      const insName = insurersList[insIndex];
      const insData = appData[currentCompetencia][insName];
      
      insData.semComissao = !insData.semComissao;
      
      if (insData.semComissao) {
        const today = getTodayFormatted();
        insData.steps.forEach(st => {
          st.checked = true;
          if (!st.date) st.date = today;
        });
      }

      saveData();
      renderInsurerCard(insIndex);
    }

    function limparInsurer(insIndex) {
      ensureCompetenciaData();
      const insName = insurersList[insIndex];
      appData[currentCompetencia][insName] = {
        semComissao: false,
        steps: defaultSteps.map(() => ({ checked: false, date: '' }))
      };
      saveData();
      renderInsurerCard(insIndex);
    }

    function limparTudo() {
      if (confirm("Tem certeza que deseja limpar todos os registros desta competência?")) {
        ensureCompetenciaData();
        insurersList.forEach(insName => {
          appData[currentCompetencia][insName] = {
            semComissao: false,
            steps: defaultSteps.map(() => ({ checked: false, date: '' }))
          };
        });
        saveData();
        render();
      }
    }

    function toggleAccordion(insIndex) {
      const content = document.getElementById(`content-${insIndex}`);
      const arrow = document.getElementById(`arrow-${insIndex}`);
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        arrow.style.transform = 'rotate(180deg)';
      } else {
        content.classList.add('hidden');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function updateStats() {
      ensureCompetenciaData();
      let concluidas = 0;
      let emAndamento = 0;
      let pendentes = 0;

      insurersList.forEach(insName => {
        const insData = appData[currentCompetencia][insName];
        const completedCount = insData.steps.filter(s => s.checked).length;
        
        if (completedCount === defaultSteps.length || insData.semComissao) {
          concluidas++;
        } else if (completedCount > 0) {
          emAndamento++;
        } else {
          pendentes++;
        }
      });

      document.getElementById('stat-total').innerText = insurersList.length;
      document.getElementById('stat-concluidas').innerText = concluidas;
      document.getElementById('stat-andamento').innerText = emAndamento;
      document.getElementById('stat-pendentes').innerText = pendentes;
    }

    function renderInsurerCard(insIndex) {
      ensureCompetenciaData();
      const insName = insurersList[insIndex];
      const insData = appData[currentCompetencia][insName];
      const completedCount = insData.steps.filter(s => s.checked).length;

      const card = document.getElementById(`card-${insIndex}`);
      if (!card) return;

      const badge = card.querySelector('.badge-count');
      if (badge) {
        badge.innerText = `${completedCount}/${defaultSteps.length}`;
      }

      const container = card.querySelector('.steps-list');
      if (container) {
        container.innerHTML = defaultSteps.map((stepName, stepIdx) => {
          const step = insData.steps[stepIdx];
          return `
            <div class="flex items-center justify-between py-2.5 px-3 rounded-lg hover:bg-brand-border/30 transition group">
              <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-4">
                <input type="checkbox" ${step.checked ? 'checked' : ''} onchange="toggleStep(${insIndex}, ${stepIdx})" 
                  class="w-5 h-5 rounded border-brand-border bg-brand-input text-brand-accent focus:ring-0 focus:ring-offset-0 cursor-pointer accent-brand-accent">
                <span class="text-sm font-medium ${step.checked ? 'line-through text-brand-muted' : 'text-brand-text'} truncate">
                  ${stepName}
                </span>
              </label>
              <input type="date" value="${step.date}" onchange="changeStepDate(${insIndex}, ${stepIdx}, this.value)" 
                class="bg-brand-input border border-brand-border rounded px-2.5 py-1 text-xs text-brand-text focus:outline-none focus:border-brand-accent">
            </div>
          `;
        }).join('');
      }

      const btnSemComissao = card.querySelector('.btn-sem-comissao');
      if (btnSemComissao) {
        if (insData.semComissao) {
          btnSemComissao.className = "btn-sem-comissao px-4 py-1.5 rounded-lg text-xs font-semibold bg-brand-accent text-black transition";
        } else {
          btnSemComissao.className = "btn-sem-comissao px-4 py-1.5 rounded-lg text-xs font-semibold border border-brand-border text-brand-text hover:bg-brand-border/50 transition";
        }
      }
    }

    function render() {
      ensureCompetenciaData();
      const container = document.getElementById('insurers-container');
      
      container.innerHTML = insurersList.map((insName, insIndex) => {
        const insData = appData[currentCompetencia][insName];
        const completedCount = insData.steps.filter(s => s.checked).length;

        return `
          <div id="card-${insIndex}" class="bg-brand-card border border-brand-border rounded-xl overflow-hidden transition">
            <!-- Header do Acordeão -->
            <div onclick="toggleAccordion(${insIndex})" class="flex items-center justify-between p-4 cursor-pointer hover:bg-brand-border/20 transition select-none">
              <div class="flex items-center gap-3">
                <svg id="arrow-${insIndex}" class="w-4 h-4 text-brand-muted transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
                <h3 class="font-bold text-white text-base md:text-lg">${insName}</h3>
              </div>
              
              <span class="badge-count text-xs font-semibold px-2.5 py-1 rounded-full bg-brand-input text-brand-muted border border-brand-border">
                ${completedCount}/${defaultSteps.length}
              </span>
            </div>

            <!-- Corpo das Etapas -->
            <div id="content-${insIndex}" class="px-4 pb-4 border-t border-brand-border/50 pt-3 space-y-3">
              <div class="steps-list space-y-1">
                ${defaultSteps.map((stepName, stepIdx) => {
                  const step = insData.steps[stepIdx];
                  return `
                    <div class="flex items-center justify-between py-2.5 px-3 rounded-lg hover:bg-brand-border/30 transition group">
                      <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-4">
                        <input type="checkbox" ${step.checked ? 'checked' : ''} onchange="toggleStep(${insIndex}, ${stepIdx})" 
                          class="w-5 h-5 rounded border-brand-border bg-brand-input text-brand-accent focus:ring-0 focus:ring-offset-0 cursor-pointer accent-brand-accent">
                        <span class="text-sm font-medium ${step.checked ? 'line-through text-brand-muted' : 'text-brand-text'} truncate">
                          ${stepName}
                        </span>
                      </label>
                      <input type="date" value="${step.date}" onchange="changeStepDate(${insIndex}, ${stepIdx}, this.value)" 
                        class="bg-brand-input border border-brand-border rounded px-2.5 py-1 text-xs text-brand-text focus:outline-none focus:border-brand-accent">
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Rodapé da Seguradora -->
              <div class="flex items-center justify-between pt-2 border-t border-brand-border/40">
                <button onclick="toggleSemComissao(${insIndex})" 
                  class="btn-sem-comissao px-4 py-1.5 rounded-lg text-xs font-semibold ${insData.semComissao ? 'bg-brand-accent text-black' : 'border border-brand-border text-brand-text hover:bg-brand-border/50'} transition">
                  — Não possui comissão
                </button>

                <button onclick="limparInsurer(${insIndex})" class="px-4 py-1.5 text-xs text-brand-muted hover:text-white border border-transparent hover:border-brand-border rounded-lg transition">
                  Limpar
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      updateStats();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_comissoes_${getTodayFormatted()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (typeof imported === 'object') {
            appData = imported;
            saveData();
            render();
            alert("Dados importados com sucesso!");
          }
        } catch(err) {
          alert("Erro ao importar o arquivo JSON.");
        }
      };
      if (event.target.files[0]) {
        reader.readAsText(event.target.files[0]);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
